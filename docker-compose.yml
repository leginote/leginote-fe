services:
  leginote-fe:
    image: node:20-alpine
    working_dir: /leginote-fe
    ports:
      - "3000:3000"
    volumes:
      - /home/ubuntu/leginote-fe:/leginote-fe
    environment:
      - PORT=3000
    command: npm run start
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.leginote-fe.rule=Host(`leginote.statpan.com`)"
      - "traefik.http.routers.leginote-fe.entrypoints=websecure"
      - "traefik.http.routers.leginote-fe.tls.certresolver=myresolver"
      - "traefik.http.routers.leginote-fe-http.rule=Host(`leginote.statpan.com`)"
      - "traefik.http.routers.leginote-fe-http.entrypoints=web"
      - "traefik.http.routers.leginote-fe-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - web

  traefik:
    image: traefik:v2.10
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik 대시보드 (선택적)
    command:
      - "--providers.docker=true" # Docker 컨테이너 감지
      - "--entrypoints.web.address=:80" # HTTP 엔트리포인트
      - "--entrypoints.websecure.address=:443" # HTTPS 엔트리포인트
      - "--certificatesresolvers.myresolver.acme.email=statpan@naver.com" # 인증서 발급 이메일
      - "--certificatesresolvers.myresolver.acme.storage=/acme.json" # 인증서 저장 위치
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web" # HTTP-01 챌린지
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Docker와 통신
      - ./acme.json:/acme.json # 인증서 데이터 저장
    networks:
      - web

networks:
  web:
    driver: bridge