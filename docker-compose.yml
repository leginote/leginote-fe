services:
  leginote-fe:
    image: node:20-alpine # 베이스 이미지
    # build: .  # 주석 처리 (GitHub Actions에서 빌드하므로)
    working_dir: /leginote-fe
    ports:
      - "3000:3000"
    volumes:
      - /home/ubuntu/leginote-fe:/leginote-fe  # 호스트와 컨테이너 간 소스 코드 마운트
    environment:
      - PORT=3000  # 포트 설정 (Next.js 기본 포트 3000)
    command: npm start # 기본 동작하므로 주석처리